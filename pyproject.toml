[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knapsack-dp-vs-greedy"
version = "0.1.0"
description = "When Does Greedy Fail? Comparing Dynamic Programming and Greedy Algorithms for the Knapsack Problem (CS 4306, KSU)"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["knapsack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "experiments"]
addopts = "-q"
